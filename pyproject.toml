[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "windowcross"
version = "0.1.1"
description = "Offline exact cross-partition time-window overlap audit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
windowcross = "windowcross.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
